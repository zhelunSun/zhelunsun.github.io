# Deploy static Next.js site to GitHub Pages
# Prerequisites (one-time, manual):
#   1. Repo renamed to `zhelunsun.github.io` (Settings → Repository name)
#      — OR keep `zhelun-website` and set basePath in next.config.ts.
#   2. Settings → Pages → Build and deployment → Source = "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate generated career contract
        run: npm run validate:career

      - name: Build static site
        run: npm run build
        env:
          # next/font needs to fetch fonts from Google at build time
          NODE_TLS_REJECT_UNAUTHORIZED: "1"

      - name: Add .nojekyll
        # Prevents GitHub from ignoring files/folders starting with "_" (e.g. _next/)
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
